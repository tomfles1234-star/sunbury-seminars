<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunbury Seminars</title>
  <style>
    body { margin:0; font-family:Georgia,serif; background:#454c5e; color:#f3efe6; }
    .bar { height:4px; background:#e67a28; }
    .box { width:min(480px, calc(100% - 2rem)); margin:5rem auto; text-align:center; }
    h1 { font-weight:400; font-size:2rem; margin:0 0 1.2rem; }
    p { font:16px/1.5 Arial,sans-serif; color:#cfc6b6; margin:0 0 1.4rem; }
    a {
      display:inline-block; color:#f3efe6; text-decoration:none;
      font:700 .85rem Arial,sans-serif; letter-spacing:.06em; text-transform:uppercase;
      border:1px solid rgba(255,255,255,.22); padding:.6rem 1.1rem; border-radius:999px;
    }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="box">
    <h1>You’re done</h1>
    <p id="note">Saving the paid attendee list.</p>
    <a href="https://sunburyseminars.com/">Back to website</a>
  </div>
  <script>
    (function () {
      var SAVE = 'https://sunbury-seminars-pay-preview.vercel.app/api/save-roster';
      var note = document.getElementById('note');
      var raw = '';
      try { raw = sessionStorage.getItem('ssiRoster') || ''; } catch (e) {}
      if (!raw) {
        note.textContent = 'Payment received.';
        return;
      }
      var payload;
      try { payload = JSON.parse(raw); } catch (e) {
        note.textContent = 'Payment received.';
        return;
      }
      payload.paid = true;
      payload.paidAt = payload.paidAt || new Date().toISOString();
      fetch(SAVE, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) {
        if (!r.ok) throw new Error('save failed');
        try { sessionStorage.removeItem('ssiRoster'); } catch (e) {}
        note.textContent = 'Payment received. Attendees are on the paid roster.';
      }).catch(function () {
        note.textContent = 'Payment received. If names are missing from the roster, email the office the names you paid for.';
      });
    })();
  </script>
</body>
</html>
