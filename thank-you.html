<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sunbury Seminars</title>
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:Georgia, "Times New Roman", serif; background:#454c5e; color:#f3efe6; min-height:100vh; }
    .bar { height:4px; background:#e67a28; }
    .box { width:min(440px, calc(100% - 2rem)); margin:0 auto; padding:6.5rem 0 4rem; text-align:center; }
    h1 { font-weight:400; font-size:clamp(2rem, 6vw, 2.6rem); margin:0 0 .7rem; }
    p { font:500 1.05rem/1.5 Arial,sans-serif; color:#cfc6b6; margin:0 0 1.7rem; }
    a {
      display:inline-block; color:#fff; text-decoration:none;
      font:700 .8rem/1 Arial,sans-serif; letter-spacing:.06em; text-transform:uppercase;
      background:#e67a28; box-shadow:0 3px 0 #b85a18;
      padding:.7rem 1.2rem; border-radius:999px;
    }
    a:hover { filter:brightness(1.06); }
  </style>
</head>
<body>
  <div class="bar"></div>
  <div class="box">
    <h1>You&rsquo;re done</h1>
    <p>Payment received.</p>
    <a href="https://sunburyseminars.com/">Back to website</a>
  </div>
  <script>
    (function () {
      var SAVE = 'https://sunbury-seminars-pay-preview.vercel.app/api/save-roster';
      var raw = '';
      try { raw = sessionStorage.getItem('ssiRoster') || ''; } catch (e) {}
      if (!raw) return;
      var payload;
      try { payload = JSON.parse(raw); } catch (e) { return; }
      payload.paid = true;
      payload.paidAt = payload.paidAt || new Date().toISOString();
      fetch(SAVE, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(function (r) {
        if (r.ok) { try { sessionStorage.removeItem('ssiRoster'); } catch (e) {} }
      }).catch(function () {});
    })();
  </script>
</body>
</html>
